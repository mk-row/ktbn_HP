<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070707">
  <title>SHOP | 血便 BLOODY STORM GAMING</title>
  <meta name="description" content="プロゲーミングチーム「血便」公式グッズ。パーカー・Tシャツ・マウスパッドとメンバー別シグネチャーアイテム。">
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <script>document.documentElement.classList.add('js')</script>
</head>
<body>
  <div class="loader" aria-hidden="true"><div class="loader__panel loader__panel--top"></div><div class="loader__panel loader__panel--bottom"></div></div>

  <main>
    <section class="phero">
      <div class="phero__bg" aria-hidden="true"></div>
      <div class="phero__marquee" aria-hidden="true">
        <div class="marquee" style="--speed:70s"><div class="marquee__track"><span class="marquee__item">OFFICIAL GOODS</span></div></div>
      </div>
      <div class="container">
        <p class="phero__crumb" data-reveal="fade"><a href="index.html">HOME</a><i></i>SHOP</p>
        <h1 class="phero__title glitch" data-split>SHOP</h1>
        <div class="phero__row">
          <p class="phero__desc" data-reveal="up">血便の魂を纏え。クラン公式グッズと、メンバー8人のシグネチャーアイテム。</p>
        </div>
      </div>
      <span class="phero__rule"></span>
    </section>

    <section class="section" style="padding-top: clamp(48px, 7vw, 88px)">
      <div class="container">
        <div class="feature" id="shop-feature"></div>

        <div class="sec-head" style="margin-bottom: 24px">
          <span class="sec-head__ghost" aria-hidden="true">GOODS</span>
          <div>
            <p class="sec-head__index" data-reveal="fade"><b>—</b> ALL ITEMS</p>
            <h2 class="sec-head__title" data-split>COLLECTION</h2>
          </div>
        </div>
        <p class="notice" data-reveal="fade"><b>DEMO</b>このページはデモ表示です。購入機能は実装されていません。</p>
        <div class="tabs-wrap">
          <div class="tabs" id="shop-tabs" role="tablist" aria-label="カテゴリで絞り込み"></div>
        </div>
        <div class="products" id="shop-grid"></div>
      </div>
    </section>
  </main>

  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
  <script src="js/render.js"></script>
  <script>
    KTBN.renderShop({
      featureEl: document.getElementById('shop-feature'),
      gridEl: document.getElementById('shop-grid'),
      tabsEl: document.getElementById('shop-tabs')
    });
  </script>
</body>
</html>
