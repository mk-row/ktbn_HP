<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070707">
  <title>NEWS | 血便 BLOODY STORM GAMING</title>
  <meta name="description" content="プロゲーミングチーム「血便」の最新ニュース。大会結果・グッズ情報・イベント告知など。">
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <script>document.documentElement.classList.add('js')</script>
</head>
<body>
  <div class="loader" aria-hidden="true"><div class="loader__panel loader__panel--top"></div><div class="loader__panel loader__panel--bottom"></div></div>

  <main>
    <section class="phero">
      <div class="phero__bg" aria-hidden="true"></div>
      <div class="phero__marquee" aria-hidden="true">
        <div class="marquee" style="--speed:70s"><div class="marquee__track"><span class="marquee__item">LATEST UPDATES</span></div></div>
      </div>
      <div class="container">
        <p class="phero__crumb" data-reveal="fade"><a href="index.html">HOME</a><i></i>NEWS</p>
        <h1 class="phero__title glitch" data-split>NEWS</h1>
        <div class="phero__row">
          <p class="phero__desc" data-reveal="up">大会結果からグッズ情報まで、血便のすべての動きを追え。</p>
        </div>
      </div>
      <span class="phero__rule"></span>
    </section>

    <section class="section" style="padding-top: clamp(48px, 7vw, 88px)">
      <div class="container">
        <div class="sec-head" style="margin-bottom: 20px">
          <div>
            <p class="sec-head__index" data-reveal="fade"><b>—</b> ARCHIVE</p>
            <h2 class="sec-head__title" data-split style="font-size: clamp(44px, 7vw, 88px)">ALL ARTICLES</h2>
          </div>
          <p class="news-count" id="news-count" data-reveal="fade">— ARTICLES</p>
        </div>
        <div class="tabs-wrap">
          <div class="tabs" id="news-tabs" role="tablist" aria-label="カテゴリで絞り込み"></div>
        </div>
        <div class="news" id="news-list"></div>
      </div>
    </section>
  </main>

  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
  <script src="js/render.js"></script>
  <script>
    KTBN.renderNews(document.getElementById('news-list'), {
      tabsEl: document.getElementById('news-tabs'),
      countEl: document.getElementById('news-count')
    });
  </script>
</body>
</html>
