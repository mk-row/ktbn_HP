<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="sh" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000" stop-opacity=".75"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a2c"/>
      <stop offset="1" stop-color="#141415"/>
    </linearGradient>
    <linearGradient id="left" x1="0" x2="1">
      <stop offset="0" stop-color="#101011"/>
      <stop offset="1" stop-color="#1b1b1d"/>
    </linearGradient>
    <linearGradient id="right" x1="0" x2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2236"/>
      <stop offset="1" stop-color="#8f000d"/>
    </linearGradient>
  </defs>
  <ellipse cx="400" cy="660" rx="300" ry="44" fill="url(#sh)"/>
  <!-- box faces -->
  <polygon points="400,240 630,334 400,428 170,334" fill="url(#top)" stroke="#39393c" stroke-width="2"/>
  <polygon points="170,334 400,428 400,650 170,556" fill="url(#left)" stroke="#2e2e31" stroke-width="2"/>
  <polygon points="400,428 630,334 630,556 400,650" fill="url(#right)" stroke="#2e2e31" stroke-width="2"/>
  <!-- ribbon -->
  <polygon points="275,283 322,264 552,358 505,377" fill="url(#red)"/>
  <polygon points="505,377 552,358 552,580 505,599" fill="#9a000e"/>
  <polygon points="170,410 400,504 400,538 170,444" fill="#c4000f"/>
  <!-- left face print -->
  <g transform="matrix(1 .4087 0 1 170 334)">
    <text x="115" y="96" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-weight="900" font-size="58" fill="#f2f2f2" letter-spacing="-2">血便</text>
    <text x="115" y="192" text-anchor="middle" font-family="Impact,'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="22" letter-spacing="5" fill="#f2f2f2">5TH ANNIVERSARY</text>
    <text x="115" y="212" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" letter-spacing="3" fill="#8a8a8a">2019 — 2024</text>
  </g>
  <!-- right face print -->
  <g transform="matrix(1 -.4087 0 1 400 428)">
    <text x="52" y="120" font-family="Impact,'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="96" fill="#e0001b" fill-opacity=".9">5</text>
    <text x="110" y="120" font-family="Impact,'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="32" fill="#f2f2f2">TH</text>
    <text x="54" y="160" font-family="'Courier New',monospace" font-size="11" letter-spacing="3" fill="#777">LIMITED 50 SETS</text>
  </g>
  <!-- sticker sheet leaning -->
  <g transform="translate(560 420) rotate(8)">
    <rect x="0" y="0" width="150" height="210" rx="6" fill="#ecebe8"/>
    <path d="M40 30 L64 70 A28 28 0 1 1 16 70 Z" fill="#e0001b"/>
    <rect x="84" y="34" width="48" height="48" rx="6" fill="#0b0b0c"/>
    <circle cx="44" cy="140" r="28" fill="#0b0b0c"/>
    <rect x="84" y="118" width="48" height="48" rx="24" fill="#e0001b"/>
    <rect x="16" y="182" width="118" height="14" rx="4" fill="#0b0b0c"/>
  </g>
</svg>
