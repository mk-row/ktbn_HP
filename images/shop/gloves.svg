<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="fab" x1="0" x2="1">
      <stop offset="0" stop-color="#0c0c0d"/>
      <stop offset=".5" stop-color="#242426"/>
      <stop offset="1" stop-color="#0b0b0c"/>
    </linearGradient>
    <radialGradient id="sh" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000" stop-opacity=".7"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2236"/>
      <stop offset="1" stop-color="#8f000d"/>
    </linearGradient>
    <g id="glove">
      <!-- finger sleeves -->
      <rect x="-92" y="-190" width="42" height="70" rx="14" fill="url(#fab)" stroke="#2e2e31" stroke-width="2"/>
      <rect x="-44" y="-212" width="42" height="92" rx="14" fill="url(#fab)" stroke="#2e2e31" stroke-width="2"/>
      <rect x="4" y="-206" width="42" height="86" rx="14" fill="url(#fab)" stroke="#2e2e31" stroke-width="2"/>
      <rect x="52" y="-184" width="40" height="64" rx="14" fill="url(#fab)" stroke="#2e2e31" stroke-width="2"/>
      <g fill="#050505">
        <rect x="-86" y="-190" width="30" height="10" rx="5"/>
        <rect x="-38" y="-212" width="30" height="10" rx="5"/>
        <rect x="10" y="-206" width="30" height="10" rx="5"/>
        <rect x="57" y="-184" width="30" height="10" rx="5"/>
      </g>
      <!-- thumb -->
      <path d="M-100 -40 C-150 -60 -175 -100 -168 -130 C-162 -150 -140 -152 -126 -138 L-90 -90 Z" fill="url(#fab)" stroke="#2e2e31" stroke-width="2"/>
      <!-- palm/back -->
      <path d="M-100 -130 L100 -130 C108 -60 104 40 96 110 L-96 110 C-104 40 -108 -60 -100 -130 Z" fill="url(#fab)" stroke="#2e2e31" stroke-width="2"/>
      <path d="M-70 -110 C-40 -90 40 -90 70 -110" stroke="#333" stroke-width="3" fill="none" stroke-dasharray="6 5"/>
      <!-- knuckle pad -->
      <rect x="-80" y="-104" width="160" height="30" rx="12" fill="#161618" stroke="#e0001b" stroke-width="2" stroke-opacity=".6"/>
      <!-- logo -->
      <path d="M0 -50 L26 -8 A30 30 0 1 1 -26 -8 Z" fill="url(#red)"/>
      <!-- wrist strap -->
      <rect x="-104" y="100" width="208" height="64" rx="10" fill="#e0001b"/>
      <rect x="-104" y="100" width="208" height="64" rx="10" fill="none" stroke="#6a0009" stroke-width="3"/>
    </g>
    <text id="strap" x="0" y="140" text-anchor="middle" font-family="Impact,'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="21" letter-spacing="2" fill="#0b0b0c">KTBN GAMING</text>
  </defs>
  <ellipse cx="400" cy="660" rx="300" ry="34" fill="url(#sh)"/>
  <g transform="translate(300 420) rotate(-12)">
    <use href="#glove"/>
    <use href="#strap"/>
  </g>
  <g transform="translate(510 440) rotate(10) scale(-1 1)">
    <use href="#glove"/>
    <use href="#strap" transform="scale(-1 1)"/>
  </g>
</svg>
