<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070707">
  <title>HISTORY | 血便 BLOODY STORM GAMING</title>
  <meta name="description" content="プロゲーミングチーム「血便」の活動経歴。2019年の設立から現在までの軌跡。">
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <script>document.documentElement.classList.add('js')</script>
</head>
<body>
  <div class="loader" aria-hidden="true"><div class="loader__panel loader__panel--top"></div><div class="loader__panel loader__panel--bottom"></div></div>

  <main>
    <section class="phero">
      <div class="phero__bg" aria-hidden="true"></div>
      <div class="phero__marquee" aria-hidden="true">
        <div class="marquee" style="--speed:70s"><div class="marquee__track"><span class="marquee__item">OUR JOURNEY</span></div></div>
      </div>
      <div class="container">
        <p class="phero__crumb" data-reveal="fade"><a href="index.html">HOME</a><i></i>HISTORY</p>
        <h1 class="phero__title glitch" data-split>HISTORY</h1>
        <div class="phero__row">
          <p class="phero__desc" data-reveal="up">2019年の設立から現在まで。勝利も敗北も、すべてが血便の歴史だ。</p>
          <p class="phero__index" data-reveal="up"><b>02</b> / 06</p>
        </div>
      </div>
      <span class="phero__rule"></span>
    </section>

    <section class="section" style="padding-top: clamp(48px, 7vw, 88px)">
      <div class="container">
        <div class="stats kpis" data-stagger=".12">
          <div class="stat"><p class="stat__num" data-count="2019"><span class="count">0</span></p><p class="stat__label">FOUNDED</p></div>
          <div class="stat"><p class="stat__num" data-count="7"><span class="count">0</span><sup>+</sup></p><p class="stat__label">TOURNAMENT WINS</p></div>
          <div class="stat"><p class="stat__num" data-count="16"><span class="count">0</span></p><p class="stat__label">MAJOR EVENTS</p></div>
        </div>

        <div class="sec-head">
          <span class="sec-head__ghost" aria-hidden="true">TIMELINE</span>
          <div>
            <p class="sec-head__index" data-reveal="fade"><b>—</b> 2019 → NOW</p>
            <h2 class="sec-head__title" data-split>TIMELINE</h2>
          </div>
        </div>

        <div class="tl" id="timeline"></div>
      </div>
    </section>
  </main>

  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
  <script src="js/render.js"></script>
  <script>
    KTBN.renderHistory(document.getElementById('timeline'));
  </script>
</body>
</html>
