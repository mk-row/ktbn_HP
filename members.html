<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070707">
  <title>MEMBERS | 血便 BLOODY STORM GAMING</title>
  <meta name="description" content="プロゲーミングチーム「血便」のメンバー一覧。ジャンルの異なる14名のプレイヤーを紹介。">
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <script>document.documentElement.classList.add('js')</script>
</head>
<body>
  <div class="loader" aria-hidden="true"><div class="loader__panel loader__panel--top"></div><div class="loader__panel loader__panel--bottom"></div></div>

  <main>
    <section class="phero">
      <div class="phero__bg" aria-hidden="true"></div>
      <div class="phero__marquee" aria-hidden="true">
        <div class="marquee" style="--speed:70s"><div class="marquee__track"><span class="marquee__item">THE CREW</span></div></div>
      </div>
      <div class="container">
        <p class="phero__crumb" data-reveal="fade"><a href="index.html">HOME</a><i></i>MEMBERS</p>
        <h1 class="phero__title glitch" data-split>MEMBERS</h1>
        <div class="phero__row">
          <p class="phero__desc" data-reveal="up">血便を構成する精鋭たち。それぞれが異なる戦場で、血便の名を刻み続ける。カードを選ぶとプロフィールが開く。</p>
          <p class="phero__index" data-reveal="up"><b>01</b> / 06</p>
        </div>
      </div>
      <span class="phero__rule"></span>
    </section>

    <section class="section" style="padding-top: clamp(48px, 7vw, 88px)">
      <div class="container">
        <div class="sec-head" style="margin-bottom: 28px">
          <div>
            <p class="sec-head__index" data-reveal="fade"><b>—</b> CAPTAINS</p>
            <h2 class="sec-head__title" data-split style="font-size: clamp(44px, 7vw, 88px)">LEADERSHIP</h2>
          </div>
        </div>
        <div class="captains" id="captains"></div>

        <div class="sec-head" style="margin-bottom: 20px">
          <div>
            <p class="sec-head__index" data-reveal="fade"><b>—</b> ROSTER</p>
            <h2 class="sec-head__title" data-split style="font-size: clamp(44px, 7vw, 88px)">PLAYERS</h2>
          </div>
          <p class="news-count" id="player-count" data-reveal="fade">— PLAYERS</p>
        </div>
        <div class="tabs-wrap">
          <div class="tabs" id="genre-tabs" role="tablist" aria-label="ジャンルで絞り込み"></div>
        </div>
        <div class="player-grid" id="player-grid"></div>
      </div>
    </section>

    <section class="cta">
      <div class="cta__bg" aria-hidden="true">
        <div class="marquee" style="--speed:40s"><div class="marquee__track"><span class="marquee__item">YOUR NAME HERE</span></div></div>
        <div class="marquee marquee--reverse" style="--speed:46s"><div class="marquee__track"><span class="marquee__item">BLEED OR GO HOME</span></div></div>
      </div>
      <div class="container cta__inner">
        <p class="cta__label" data-reveal="fade">// NEXT PLAYER</p>
        <h2 class="cta__title" data-reveal="mask"><span class="nb">次の15人目は、</span><span class="nb">お前だ。</span></h2>
        <a href="contact.html" class="btn btn--white" data-reveal="up">APPLY NOW</a>
      </div>
    </section>
  </main>

  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
  <script src="js/render.js"></script>
  <script>
    KTBN.renderMembersPage({
      captainsEl: document.getElementById('captains'),
      gridEl: document.getElementById('player-grid'),
      tabsEl: document.getElementById('genre-tabs'),
      countEl: document.getElementById('player-count')
    });
  </script>
</body>
</html>
